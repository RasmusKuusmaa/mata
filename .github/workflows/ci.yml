name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lai_matemaatika
          POSTGRES_PASSWORD: lai_matemaatika
          POSTGRES_DB: lai_matemaatika
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lai_matemaatika"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://lai_matemaatika:lai_matemaatika@localhost:5432/lai_matemaatika
      GUEST_COOKIE_SECRET: ci-guest-cookie-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run check
      - run: npm run build
